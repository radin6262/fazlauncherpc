name: Build Windows Desktop App

on:
  workflow_dispatch:
    inputs:
      release_draft:
        description: "Create draft release with Windows build"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    # Restrict execution strictly to the repository owner
    if: github.actor == github.repository_owner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Zip Release Directory
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "app-windows-release.zip"
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App-Build-${{ github.run_number }}
          path: app-windows-release.zip
          if-no-files-found: error

  release:
    name: Create Draft Release
    needs: build-windows
    runs-on: ubuntu-latest
    if: ${{ github.actor == github.repository_owner && inputs.release_draft }}

    steps:
      # FIX: Checkout the repository so gh has a valid .git context
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows-App-Build-${{ github.run_number }}
          path: artifact

      - name: Create GitHub Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" \
            artifact/app-windows-release.zip \
            --draft \
            --title "Windows Desktop - Build #${{ github.run_number }}" \
            --notes "Automated Windows desktop release.
          
            - **Build Number:** ${{ github.run_number }}
            - **Commit:** ${{ github.sha }}"