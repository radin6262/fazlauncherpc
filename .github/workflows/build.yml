name: Build Flutter PC App

on:
  workflow_dispatch:
    inputs:
      release_draft:
        description: "Create draft release with build artifacts"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # Restrict execution strictly to the repository owner
    if: github.actor == github.repository_owner

    strategy:
      matrix:
        include:
          - os: windows-latest
            build_target: windows
            artifact_name: app-windows-release.zip
            artifact_path: build/windows/x64/runner/Release/
          - os: ubuntu-latest
            build_target: linux
            artifact_name: app-linux-release.tar.gz
            artifact_path: build/linux/x64/release/bundle/
          - os: macos-latest
            build_target: macos
            artifact_name: app-macos-release.zip
            artifact_path: build/macos/Build/Products/Release/

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies (Ubuntu Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Desktop App
        run: flutter build ${{ matrix.build_target }} --release

      # Optional compression step to make artifact uploading cleaner
      - name: Compress Artifacts (Windows/Linux)
        if: matrix.os != 'macos-latest'
        run: |
          cd ${{ matrix.artifact_path }}
          tar -czf ../../../${{ matrix.artifact_name }} *
        shell: bash

      - name: Compress Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd "${{ matrix.artifact_path }}"
          zip -r ../../../${{ matrix.artifact_name }} .
        shell: bash

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-${{ matrix.build_target }}-build-${{ github.run_number }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Create Draft Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.actor == github.repository_owner && inputs.release_draft }}

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: compressed-artifacts

      - name: List Artifacts for Verification
        run: ls -R compressed-artifacts

      - name: Create GitHub Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" \
            compressed-artifacts/Desktop-windows-build-${{ github.run_number }}/app-windows-release.zip \
            compressed-artifacts/Desktop-linux-build-${{ github.run_number }}/app-linux-release.tar.gz \
            compressed-artifacts/Desktop-macos-build-${{ github.run_number }}/app-macos-release.zip \
            --draft \
            --title "Desktop App - Build #${{ github.run_number }}" \
            --notes "Automated cross-platform desktop release.
          
            - **Build Number:** ${{ github.run_number }}
            - **Commit:** ${{ github.sha }}"